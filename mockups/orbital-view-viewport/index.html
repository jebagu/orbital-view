<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Viewport Mockup</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      background: #071014;
      color: #effcff;
      --panel: rgba(13, 24, 29, 0.9);
      --panel-2: rgba(255, 255, 255, 0.045);
      --line: rgba(217, 251, 255, 0.14);
      --muted: #9fb9bd;
      --text: #effcff;
      --teal: #5eead4;
      --green: #18ce0f;
      --amber: #facc15;
      --hot: #fb7185;
      --pink: #f75ba7;
      --black: #111111;
      --page-bg: linear-gradient(180deg, #071014 0%, #02070a 100%);
      --rail-bg: rgba(13, 24, 29, 0.9);
      --toolbar-bg: rgba(5, 12, 15, 0.7);
      --button-bg: rgba(255, 255, 255, 0.045);
      --button-hover-bg: rgba(94, 234, 212, 0.1);
      --button-hover-border: rgba(217, 251, 255, 0.26);
      --button-active-bg: rgba(94, 234, 212, 0.16);
      --button-active-border: #5eead4;
      --button-active-text: #effcff;
      --accent: #5eead4;
      --accent-strong: #aa88ff;
      --metric-bg: rgba(255, 255, 255, 0.045);
      --metric-border: rgba(217, 251, 255, 0.14);
      --row-line: rgba(217, 251, 255, 0.1);
      --bar-track: rgba(217, 251, 255, 0.14);
      --status-bg: rgba(5, 12, 15, 0.7);
      --chip-bg: rgba(255, 255, 255, 0.045);
      --dot: #18ce0f;
      --dot-shadow: 0 0 10px rgba(24, 206, 15, 0.7);
      --grid-line: rgba(217, 251, 255, 0.05);
      --main-bg: linear-gradient(180deg, #071014 0%, #02070a 100%);
      --slider-value: #ffffff;
    }

    body[data-render-style="flamingo"] {
      --page-bg: #0d090c;
      --rail-bg: #140c12;
      --toolbar-bg: rgba(25, 10, 18, 0.78);
      --panel: #171016;
      --panel-2: #20131b;
      --line: #432236;
      --muted: #caa1b8;
      --text: #fff3f9;
      --button-bg: #23131d;
      --button-hover-bg: #301828;
      --button-hover-border: #915174;
      --button-active-bg: #3a1230;
      --button-active-border: #f75ba7;
      --button-active-text: #ffe7f3;
      --accent: #f75ba7;
      --accent-strong: #ffb3d7;
      --metric-bg: #1b1018;
      --metric-border: #442337;
      --row-line: #33202b;
      --bar-track: #3a1d2d;
      --status-bg: #140c12;
      --chip-bg: #23131d;
      --dot: #f75ba7;
      --dot-shadow: 0 0 12px rgba(247, 91, 167, 0.72);
      --grid-line: #20131b;
      --main-bg: #0d090c;
    }

    body[data-render-style="purple"] {
      color-scheme: dark;
      --page-bg: linear-gradient(180deg, #0a0811 0%, #000000 100%);
      --rail-bg: rgba(20, 24, 28, 0.92);
      --toolbar-bg: rgba(29, 33, 37, 0.82);
      --panel: rgba(20, 24, 28, 0.92);
      --panel-2: rgba(170, 136, 255, 0.09);
      --line: rgba(255, 255, 255, 0.12);
      --muted: #aaacad;
      --text: #f2f2f2;
      --button-bg: rgba(170, 136, 255, 0.09);
      --button-hover-bg: rgba(170, 136, 255, 0.15);
      --button-hover-border: rgba(255, 255, 255, 0.24);
      --button-active-bg: rgba(170, 136, 255, 0.2);
      --button-active-border: #aa88ff;
      --button-active-text: #f2f2f2;
      --accent: #aa88ff;
      --accent-strong: #32d6bf;
      --metric-bg: rgba(170, 136, 255, 0.09);
      --metric-border: rgba(255, 255, 255, 0.12);
      --row-line: rgba(255, 255, 255, 0.08);
      --bar-track: rgba(255, 255, 255, 0.12);
      --status-bg: rgba(29, 33, 37, 0.82);
      --chip-bg: rgba(170, 136, 255, 0.09);
      --dot: #18ce0f;
      --dot-shadow: 0 0 12px rgba(170, 136, 255, 0.72);
      --grid-line: rgba(255, 255, 255, 0.045);
      --main-bg: linear-gradient(180deg, #0a0811 0%, #000000 100%);
      --slider-value: #f2f2f2;
    }

    body[data-render-style="bw"] {
      color-scheme: light;
      --page-bg: #ffffff;
      --rail-bg: #f3f3f3;
      --toolbar-bg: rgba(255, 255, 255, 0.86);
      --panel: #f7f7f7;
      --panel-2: #ffffff;
      --line: #b9b9b9;
      --muted: #5d5d5d;
      --text: #111111;
      --button-bg: #ffffff;
      --button-hover-bg: #eeeeee;
      --button-hover-border: #333333;
      --button-active-bg: #111111;
      --button-active-border: #111111;
      --button-active-text: #ffffff;
      --accent: #111111;
      --accent-strong: #111111;
      --metric-bg: #ffffff;
      --metric-border: #bbbbbb;
      --row-line: #d8d8d8;
      --bar-track: #dddddd;
      --status-bg: #f3f3f3;
      --chip-bg: #ffffff;
      --dot: #111111;
      --dot-shadow: 0 0 0 rgba(17, 17, 17, 0);
      --grid-line: #e7ebea;
      --main-bg: #ffffff;
      --slider-value: #111111;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg);
      color: var(--text);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 300px;
      grid-template-rows: minmax(0, 1fr) 46px;
      height: 100vh;
      min-height: 100vh;
    }

    .control-rail {
      display: grid;
      grid-row: 1 / -1;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
      padding: 12px;
      border-right: 1px solid var(--line);
      background: var(--rail-bg);
    }

    .brand {
      display: grid;
      gap: 3px;
      padding: 4px 2px;
      line-height: 1.1;
    }

    .brand strong {
      font-size: 13px;
      letter-spacing: 0;
      font-weight: 720;
    }

    .brand span {
      color: var(--muted);
      font-size: 11px;
    }

    .viewport-toolbar {
      align-content: start;
      display: grid;
      gap: 16px;
      min-height: 0;
      overflow: auto;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--toolbar-bg);
      backdrop-filter: blur(14px);
    }

    .toolbar-actions,
    .toolbar-section,
    .toolbar-slider,
    .control-group,
    .segmented {
      display: grid;
      gap: 8px;
    }

    .toolbar-actions > span,
    .toolbar-section > span,
    .toolbar-slider > span,
    .control-group > span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .control-group {
      gap: 10px;
    }

    button {
      border: 1px solid var(--line);
      background: var(--button-bg);
      color: var(--text);
      min-height: 34px;
      padding: 7px 9px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--button-hover-border);
      background: var(--button-hover-bg);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    button[aria-pressed="true"],
    .segmented button.active,
    .tool-button.active {
      border-color: var(--button-active-border);
      background: var(--button-active-bg);
      color: var(--button-active-text);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .toggle-row input {
      width: 24px;
      min-width: 24px;
      height: 24px;
      min-height: 24px;
      accent-color: var(--accent);
    }

    .switch-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .switch-row input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch-track {
      position: relative;
      display: inline-block;
      width: 46px;
      min-width: 46px;
      height: 25px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--button-bg);
      transition: background 120ms ease, border-color 120ms ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 17px;
      height: 17px;
      border-radius: 999px;
      background: var(--muted);
      transition: transform 120ms ease, background 120ms ease;
    }

    .switch-row input:checked + .switch-track {
      border-color: var(--button-active-border);
      background: var(--button-active-bg);
    }

    .switch-row input:checked + .switch-track::after {
      transform: translateX(21px);
      background: var(--accent-strong);
    }

    .switch-row input:focus-visible + .switch-track {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .toolbar-slider-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    main {
      position: relative;
      min-height: 0;
      overflow: hidden;
      background:
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
        var(--main-bg);
      background-size: 36px 36px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    aside {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
      padding: 12px;
      border-left: 1px solid var(--line);
      background: var(--panel);
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      padding: 12px;
    }

    h1,
    h2 {
      margin: 0;
      font-size: 12px;
      letter-spacing: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .metric {
      min-height: 58px;
      border: 1px solid var(--metric-border);
      border-radius: 7px;
      padding: 8px;
      background: var(--metric-bg);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }

    .metric strong {
      display: block;
      font-size: 20px;
      margin-top: 5px;
      letter-spacing: 0;
    }

    .speaker-list {
      overflow: auto;
      min-height: 0;
    }

    .speaker-row {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      border-bottom: 1px solid var(--row-line);
      font-size: 12px;
    }

    .speaker-row:last-child {
      border-bottom: 0;
    }

    .bar {
      height: 6px;
      border-radius: 3px;
      background: var(--bar-track);
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0%;
    }

    .status {
      grid-column: 2 / -1;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 16px;
      align-items: center;
      min-height: 46px;
      padding: 8px 14px;
      border-top: 1px solid var(--line);
      background: var(--status-bg);
      color: var(--muted);
      font-size: 12px;
    }

    .status strong {
      color: var(--text);
      font-weight: 650;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 8px;
      color: var(--text);
      background: var(--chip-bg);
      white-space: nowrap;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--dot);
      box-shadow: var(--dot-shadow);
    }

    .empty {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .app {
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: auto 62vh auto auto;
      }

      .control-rail {
        grid-row: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      aside {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .status {
        grid-column: 1 / -1;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body data-render-style="purple">
  <div class="app">
    <nav class="control-rail" aria-label="3D model controls">
      <div class="brand">
        <strong>OrbitalViewKit</strong>
        <span>Fey 30 / 3V Shell</span>
      </div>
      <div class="viewport-toolbar">
        <div class="toolbar-actions">
          <span>Camera</span>
          <div class="segmented" aria-label="Camera">
            <button class="tool-button view-mode" data-view="plan" aria-pressed="false">Plan</button>
            <button class="tool-button view-mode" data-view="elevation" aria-pressed="false">Elevation</button>
            <button class="tool-button view-mode active" data-view="isometric" aria-pressed="true">Isometric</button>
          </div>
          <div class="segmented" aria-label="Camera actions">
            <button class="tool-button" id="reset">Reset</button>
            <button class="tool-button" id="spin" aria-pressed="false">Spin</button>
            <button class="tool-button" id="exportPng">Export PNG</button>
          </div>
        </div>
        <div class="toolbar-section">
          <span>Color</span>
          <div class="segmented" aria-label="Color">
            <button class="render-style active" data-render-style="purple" aria-pressed="true">Purple</button>
            <button class="render-style" data-render-style="flamingo" aria-pressed="false">Flamingo</button>
            <button class="render-style" data-render-style="green" aria-pressed="false">Green</button>
            <button class="render-style" data-render-style="bw" aria-pressed="false">B&amp;W</button>
          </div>
        </div>
        <div class="toolbar-section">
          <span>Speaker Shape</span>
          <div class="segmented" aria-label="Speaker shape">
            <button class="shape-mode active" data-shape="prism" aria-pressed="true">Prism</button>
            <button class="shape-mode" data-shape="sphere" aria-pressed="false">Sphere</button>
          </div>
        </div>
        <div class="control-group">
          <span>View Detail</span>
          <label class="toolbar-slider">
            <span>Speaker size</span>
            <div class="toolbar-slider-row">
              <input id="speakerSize" type="range" min="0" max="100" step="1" value="50" aria-label="Speaker size">
            </div>
          </label>
          <label class="toolbar-slider">
            <span>Fog density</span>
            <div class="toolbar-slider-row">
              <input id="fogDensity" type="range" min="0" max="100" step="1" value="57">
            </div>
          </label>
          <label class="switch-row toolbar-switch">
            <span>Speaker numbers</span>
            <input id="speakerNumbers" type="checkbox" role="switch" aria-label="Speaker numbers">
            <i class="switch-track" aria-hidden="true"></i>
          </label>
          <label class="switch-row toolbar-switch">
            <span>Hidden Lines</span>
            <input id="hiddenLines" type="checkbox" role="switch" aria-label="Hidden Lines">
            <i class="switch-track" aria-hidden="true"></i>
          </label>
        </div>
      </div>
    </nav>

    <main>
      <canvas id="viewport" aria-label="Orbital 3D Sonic Sphere viewport"></canvas>
    </main>

    <aside>
      <section class="panel">
        <h1>Scene</h1>
        <div class="metric-grid">
          <div class="metric">
            <span>Active</span>
            <strong id="activeCount">0/30</strong>
          </div>
          <div class="metric">
            <span>Peak</span>
            <strong id="peakText">Fey 01</strong>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2 id="selectionTitle">No speaker selected</h2>
        <p class="empty" id="selectionBody">Click a speaker in the viewport to inspect channel identity, coordinates, and level state.</p>
      </section>

      <section class="panel speaker-list" id="speakerList" aria-label="Speaker levels"></section>
    </aside>

    <footer class="status">
      <span><strong id="cameraText">Isometric</strong> / Center locked / DomeLab panel</span>
      <span class="chip"><i class="dot"></i><span id="sourceText">Fake meter stream</span></span>
      <span class="chip"><span id="zoomText">Zoom 1.00x</span></span>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById("viewport");
    const ctx = canvas.getContext("2d");
    const viewButtons = [...document.querySelectorAll(".view-mode")];
    const renderStyleButtons = [...document.querySelectorAll(".render-style")];
    const shapeButtons = [...document.querySelectorAll(".shape-mode")];
    const spinButton = document.getElementById("spin");
    const exportButton = document.getElementById("exportPng");
    const speakerSizeInput = document.getElementById("speakerSize");
    const fogDensityInput = document.getElementById("fogDensity");
    const speakerNumbersCheckbox = document.getElementById("speakerNumbers");
    const hiddenLinesSwitch = document.getElementById("hiddenLines");
    const list = document.getElementById("speakerList");
    const activeCount = document.getElementById("activeCount");
    const peakText = document.getElementById("peakText");
    const cameraText = document.getElementById("cameraText");
    const zoomText = document.getElementById("zoomText");
    const selectionTitle = document.getElementById("selectionTitle");
    const selectionBody = document.getElementById("selectionBody");

    const palettes = {
      green: {
        backgroundTop: "#071014",
        backgroundBottom: "#02070a",
        structure: "rgba(217, 251, 255, 0.14)",
        structureSecondary: "rgba(217, 251, 255, 0.08)",
        equator: "rgba(170, 136, 255, 0.22)",
        label: "rgba(159, 185, 189, 0.78)",
        selectedLabel: "#effcff",
        fog: "rgba(2, 7, 10, 0.5)",
        backgroundGlow: "rgba(94, 234, 212, 0.1)",
        meterLow: "#5eead4",
        meterMid: "#18ce0f",
        meterHigh: "#facc15",
        meterHot: "#fb7185",
        bar: "linear-gradient(90deg, #5eead4, #18ce0f, #facc15, #fb7185)"
      },
      flamingo: {
        background: "#0b0c0d",
        structure: "rgba(247, 91, 167, 0.34)",
        structureSecondary: "rgba(247, 91, 167, 0.22)",
        equator: "rgba(247, 91, 167, 0.28)",
        label: "rgba(255, 223, 240, 0.78)",
        selectedLabel: "#ffffff",
        fog: "rgba(11, 12, 13, 0.48)",
        backgroundGlow: "rgba(247, 91, 167, 0.1)",
        bar: "linear-gradient(90deg, #f75ba7, #ffb3d7)"
      },
      purple: {
        backgroundTop: "#0a0811",
        backgroundBottom: "#000000",
        structure: "rgba(255, 255, 255, 0.12)",
        structureSecondary: "rgba(170, 136, 255, 0.18)",
        equator: "rgba(50, 214, 191, 0.26)",
        label: "rgba(170, 172, 173, 0.78)",
        selectedLabel: "#f2f2f2",
        fog: "rgba(0, 0, 0, 0.52)",
        backgroundGlow: "rgba(170, 136, 255, 0.12)",
        meterLow: "#aa88ff",
        meterMid: "#32d6bf",
        meterHigh: "#ffb236",
        meterHot: "#ff3636",
        bar: "linear-gradient(90deg, #aa88ff, #32d6bf, #ffb236, #ff3636)"
      },
      bw: {
        background: "#ffffff",
        structure: "rgba(17, 17, 17, 0.5)",
        structureSecondary: "rgba(17, 17, 17, 0.28)",
        equator: "rgba(17, 17, 17, 0.42)",
        label: "rgba(17, 17, 17, 0.76)",
        selectedLabel: "#111111",
        fog: "rgba(255, 255, 255, 0.5)",
        backgroundGlow: "rgba(17, 17, 17, 0.035)",
        bar: "linear-gradient(90deg, #111111, #777777)"
      }
    };

    const speakerSizeCenter = 1.95;
    const fogMidpointDensity = 30;
    const fogDensityExponent = Math.log(fogMidpointDensity / 100) / Math.log(0.5);

    function speakerSizeFromSlider(value) {
      const offset = (Number(value) - 50) / 50;
      return speakerSizeCenter * Math.pow(2, offset);
    }

    function fogDensityFromSlider(value) {
      const normalized = Math.max(0, Math.min(1, Number(value) / 100));
      return Math.round(100 * Math.pow(normalized, fogDensityExponent));
    }

    const state = {
      yaw: Math.PI * 0.25,
      pitch: Math.PI * 0.22,
      zoom: 1,
      cameraView: "isometric",
      renderStyle: "purple",
      speakerShape: "prism",
      speakerSize: speakerSizeFromSlider(speakerSizeInput.value),
      spin: false,
      showSpeakerNumbers: false,
      showHiddenLines: false,
      fogDensity: fogDensityFromSlider(fogDensityInput.value),
      selected: null,
      dragging: false,
      lastX: 0,
      lastY: 0,
      time: 0,
      lastFrame: 0
    };

    const rawSpeakers = [
      [1, "Fey 01", 0, 0.554700196225229, -0.832050294337844],
      [2, "Fey 02", 0.545454545454545, 0.181818181818182, -0.818181818181818],
      [3, "Fey 03", 0.331448998468967, -0.45113891458276, -0.828622496172417],
      [4, "Fey 04", -0.331448998468967, -0.45113891458276, -0.828622496172417],
      [5, "Fey 05", -0.545454545454545, 0.181818181818182, -0.818181818181818],
      [6, "Fey 06", -0.548614782048403, 0.630906999355663, -0.548614782048403],
      [7, "Fey 07", 0.548614782048403, 0.630906999355663, -0.548614782048403],

      [30, "Fey 30", 0.774258005430618, 0.251633851764951, 0.580693504072963]
    ];

    const speakers = rawSpeakers.map(([channel, label, x, y, z]) => ({
      channel, label, x, y, z, rms: 0, peak: 0, sx: 0, sy: 0, depth: 0, scale: 1
    }));

    function palette() {
      return palettes[state.renderStyle];
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * dpr));
      canvas.height = Math.max(1, Math.floor(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function rotate(point) {
      const cy = Math.cos(state.yaw);
      const sy = Math.sin(state.yaw);
      const cp = Math.cos(state.pitch);
      const sp = Math.sin(state.pitch);

      const x1 = point.x * cy - point.z * sy;
      const z1 = point.x * sy + point.z * cy;
      const y1 = point.y * cp - z1 * sp;
      const z2 = point.y * sp + z1 * cp;
      return { x: x1, y: y1, z: z2 };
    }

    function sphereScreenRadius(width, height) {
      return Math.min(width, height) * 0.34 * state.zoom;
    }

    function project(point, width, height) {
      const radius = sphereScreenRadius(width, height);
      return {
        x: width * 0.5 + point.x * radius,
        y: height * 0.5 - point.y * radius,
        depth: point.z,
        scale: 1
      };
    }

    function meter(channel, t) {
      const a = Math.sin(t * 0.0019 + channel * 0.73) * 0.5 + 0.5;
      const b = Math.sin(t * 0.0031 + channel * 1.31) * 0.5 + 0.5;
      const pulse = Math.max(0, Math.sin(t * 0.006 + channel) - 0.78) * 3.8;
      const rms = Math.min(1, a * 0.44 + b * 0.16 + pulse * 0.16);
      const peak = Math.min(1, rms + b * 0.28);
      return { rms, peak };
    }

    function colorForPeak(peak) {
      if (state.renderStyle === "flamingo") return "#f75ba7";
      if (state.renderStyle === "bw") return "#111111";
      const colors = palette();
      if (peak > 0.9) return colors.meterHot;
      if (peak > 0.68) return colors.meterHigh;
      if (peak > 0.35) return colors.meterMid;
      return colors.meterLow;
    }

    function hexToRgb(hex) {
      const value = hex.replace("#", "");
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }

    function rgba(hex, alpha) {
      const rgb = hexToRgb(hex);
      return `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, ${alpha})`;
    }

    function add3(a, b) {
      return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z };
    }

    function scale3(vector, scalar) {
      return { x: vector.x * scalar, y: vector.y * scalar, z: vector.z * scalar };
    }

    function dot3(a, b) {
      return a.x * b.x + a.y * b.y + a.z * b.z;
    }

    function cross3(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function normalize3(vector, fallback = { x: 1, y: 0, z: 0 }) {
      const length = Math.hypot(vector.x, vector.y, vector.z);
      if (length < 0.0001) return fallback;
      return { x: vector.x / length, y: vector.y / length, z: vector.z / length };
    }

    function lerp3(a, b, t) {
      return {
        x: a.x + (b.x - a.x) * t,
        y: a.y + (b.y - a.y) * t,
        z: a.z + (b.z - a.z) * t
      };
    }

    const feySphereGeodesicConfig = {
      source: "fey sphere - domelab-configuration.json",
      diameterM: 7.166739952475426,
      radiusM: 3.583369976237713,
      shape: "full-sphere",
      sphereCoverage: 1,
      orientationMode: "vertex-up",
      basePolyhedron: "icosahedron",
      frequency: 3,
      subdivisionClass: "class-I",
      showNodeMarkers: true
    };

    const icosahedronFaces = [
      [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
      [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
      [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
      [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
    ];

    function createIcosahedronVertices() {
      const phi = (1 + Math.sqrt(5)) / 2;
      return [
        { x: -1, y: phi, z: 0 },
        { x: 1, y: phi, z: 0 },
        { x: -1, y: -phi, z: 0 },
        { x: 1, y: -phi, z: 0 },
        { x: 0, y: -1, z: phi },
        { x: 0, y: 1, z: phi },
        { x: 0, y: -1, z: -phi },
        { x: 0, y: 1, z: -phi },
        { x: phi, y: 0, z: -1 },
        { x: phi, y: 0, z: 1 },
        { x: -phi, y: 0, z: -1 },
        { x: -phi, y: 0, z: 1 }
      ].map(vertex => normalize3(vertex));
    }

    function rotateVectorBetween(vector, from, to) {
      const source = normalize3(from);
      const target = normalize3(to);
      const axis = cross3(source, target);
      const sin = Math.hypot(axis.x, axis.y, axis.z);
      const cos = dot3(source, target);

      if (sin < 0.00001) {
        if (cos > 0) return vector;
        return { x: vector.x, y: -vector.y, z: -vector.z };
      }

      const unitAxis = scale3(axis, 1 / sin);
      return add3(
        add3(
          scale3(vector, cos),
          scale3(cross3(unitAxis, vector), sin)
        ),
        scale3(unitAxis, dot3(unitAxis, vector) * (1 - cos))
      );
    }

    function buildFeyGeodesicStructure(config) {
      if (config.basePolyhedron !== "icosahedron" || config.subdivisionClass !== "class-I") {
        throw new Error("Unsupported Fey geodesic configuration");
      }

      const frequency = config.frequency;
      const baseVertices = createIcosahedronVertices();
      const vertexUpSource = baseVertices[5];
      const alignedBaseVertices = config.orientationMode === "vertex-up"
        ? baseVertices.map(vertex => rotateVectorBetween(vertex, vertexUpSource, { x: 0, y: 1, z: 0 }))
        : baseVertices;
      const nodes = [];
      const nodeIds = new Map();
      const edgeIds = new Map();

      function nodeKey(point) {
        return `${point.x.toFixed(6)},${point.y.toFixed(6)},${point.z.toFixed(6)}`;
      }

      function nodeId(point) {
        const normalized = normalize3(point);
        const key = nodeKey(normalized);
        if (!nodeIds.has(key)) {
          nodeIds.set(key, nodes.length);
          nodes.push(normalized);
        }
        return nodeIds.get(key);
      }

      function addEdge(a, b) {
        if (a === b) return;
        const key = a < b ? `${a}:${b}` : `${b}:${a}`;
        if (!edgeIds.has(key)) edgeIds.set(key, a < b ? [a, b] : [b, a]);
      }

      for (const face of icosahedronFaces) {
        const a = alignedBaseVertices[face[0]];
        const b = alignedBaseVertices[face[1]];
        const c = alignedBaseVertices[face[2]];
        const localNodes = new Map();

        function localNodeId(i, j) {
          const key = `${i}:${j}`;
          if (!localNodes.has(key)) {
            const k = frequency - i - j;
            const point = add3(
              add3(scale3(a, k / frequency), scale3(b, i / frequency)),
              scale3(c, j / frequency)
            );
            localNodes.set(key, nodeId(point));
          }
          return localNodes.get(key);
        }

        for (let i = 0; i <= frequency; i++) {
          for (let j = 0; j <= frequency - i; j++) {
            const current = localNodeId(i, j);
            for (const [di, dj] of [[1, 0], [0, 1], [-1, 1]]) {
              const nextI = i + di;
              const nextJ = j + dj;
              if (nextI >= 0 && nextJ >= 0 && nextI + nextJ <= frequency) {
                addEdge(current, localNodeId(nextI, nextJ));
              }
            }
          }
        }
      }

      const edges = [...edgeIds.values()].map(([a, b]) => ({
        a,
        b,
        length: Math.hypot(nodes[a].x - nodes[b].x, nodes[a].y - nodes[b].y, nodes[a].z - nodes[b].z)
      }));
      const lengthKeys = [...new Set(edges.map(edge => edge.length.toFixed(5)))].sort((a, b) => Number(a) - Number(b));
      for (const edge of edges) {
        edge.lengthGroup = lengthKeys.indexOf(edge.length.toFixed(5));
      }

      return { nodes, edges, lengthKeys };
    }

    const feyGeodesicStructure = buildFeyGeodesicStructure(feySphereGeodesicConfig);

    const frontClipPlane = -0.04;

    function clamp01(value) {
      return Math.max(0, Math.min(1, value));
    }

    function hiddenDepthFade(depth) {
      if (depth >= frontClipPlane) return 1;
      const intensity = clamp01(state.fogDensity / 100);
      const behindAmount = clamp01((frontClipPlane - depth) / (1 + frontClipPlane));
      return clamp01(1 - intensity * (1.05 + behindAmount * 0.7));
    }

    function hiddenLinesVisible() {
      return state.showHiddenLines && state.fogDensity < 100;
    }

    function isVisibleDepth(depth) {
      return depth >= frontClipPlane || (hiddenLinesVisible() && hiddenDepthFade(depth) > 0.02);
    }

    function foggedAlpha(depth, baseAlpha) {
      return baseAlpha * hiddenDepthFade(depth);
    }

    function drawBackground(width, height) {
      const colors = palette();
      if (colors.backgroundTop && colors.backgroundBottom) {
        const background = ctx.createLinearGradient(0, 0, 0, height);
        background.addColorStop(0, colors.backgroundTop);
        background.addColorStop(1, colors.backgroundBottom);
        ctx.fillStyle = background;
      } else {
        ctx.fillStyle = colors.background;
      }
      ctx.fillRect(0, 0, width, height);

      if (colors.backgroundGlow) {
        const gradient = ctx.createRadialGradient(width * 0.5, height * 0.42, 0, width * 0.5, height * 0.5, Math.max(width, height) * 0.65);
        gradient.addColorStop(0, colors.backgroundGlow);
        gradient.addColorStop(1, "rgba(11, 12, 13, 0)");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
      }
    }

    function clipSegmentToFront(start, end) {
      if (hiddenLinesVisible()) return [start, end];

      const startInside = start.z >= frontClipPlane;
      const endInside = end.z >= frontClipPlane;
      if (!startInside && !endInside) return null;
      if (startInside && endInside) return [start, end];

      const t = (frontClipPlane - start.z) / (end.z - start.z);
      const clipped = lerp3(start, end, t);
      return startInside ? [start, clipped] : [clipped, end];
    }

    function drawGeodesicNodes(width, height) {
      if (!feySphereGeodesicConfig.showNodeMarkers) return;
      const colors = palette();
      ctx.save();
      ctx.fillStyle = colors.structure;
      for (const node of feyGeodesicStructure.nodes) {
        const rotated = rotate(node);
        if (!isVisibleDepth(rotated.z)) continue;
        const p = project(rotated, width, height);
        ctx.globalAlpha = 0.42 * hiddenDepthFade(rotated.z);
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.45, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawStructure(width, height) {
      const colors = palette();
      const edgeViews = feyGeodesicStructure.edges.map(edge => {
        const start = rotate(feyGeodesicStructure.nodes[edge.a]);
        const end = rotate(feyGeodesicStructure.nodes[edge.b]);
        const clipped = clipSegmentToFront(start, end);
        if (!clipped) return null;
        const fade = Math.min(hiddenDepthFade(clipped[0].z), hiddenDepthFade(clipped[1].z));
        if (fade <= 0.02) return null;
        return {
          edge,
          start: clipped[0],
          end: clipped[1],
          depth: (clipped[0].z + clipped[1].z) * 0.5,
          fade
        };
      }).filter(Boolean).sort((a, b) => a.depth - b.depth);

      ctx.save();
      ctx.lineCap = "round";
      for (const edgeView of edgeViews) {
        const start = project(edgeView.start, width, height);
        const end = project(edgeView.end, width, height);
        const groupAlpha = [0.58, 0.78, 0.96][edgeView.edge.lengthGroup] || 0.72;
        ctx.globalAlpha = groupAlpha * edgeView.fade;
        ctx.strokeStyle = edgeView.edge.lengthGroup === 2 ? colors.equator : colors.structure;
        ctx.lineWidth = edgeView.edge.lengthGroup === 2 ? 1.15 : 0.9;
        ctx.beginPath();
        ctx.moveTo(start.x, start.y);
        ctx.lineTo(end.x, end.y);
        ctx.stroke();
      }
      ctx.restore();
      drawGeodesicNodes(width, height);
    }

    function drawHiddenLinesBoundary(width, height) {
      if (hiddenLinesVisible()) return;
      const colors = palette();
      ctx.save();
      ctx.beginPath();
      ctx.arc(width * 0.5, height * 0.5, sphereScreenRadius(width, height), 0, Math.PI * 2);
      ctx.strokeStyle = colors.structure;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();
    }

    function drawFogVeil(width, height) {
      if (state.fogDensity <= 0) return;
      const colors = palette();
      const alpha = Math.min(0.34, state.fogDensity / 320);
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, colors.fog);
      gradient.addColorStop(0.48, `rgba(0, 0, 0, ${state.renderStyle === "bw" ? 0 : alpha * 0.22})`);
      gradient.addColorStop(1, colors.fog);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
      ctx.restore();
    }

    function drawSpeakerSphere(speaker, color, alpha, selected) {
      const radius = 8.2 * speaker.scale;
      const body = ctx.createRadialGradient(
        speaker.sx - radius * 0.38,
        speaker.sy - radius * 0.42,
        radius * 0.08,
        speaker.sx,
        speaker.sy,
        radius
      );
      body.addColorStop(0, state.renderStyle === "bw" ? "rgba(255, 255, 255, 0.88)" : "rgba(241, 255, 250, 0.58)");
      body.addColorStop(0.34, rgba(color, state.renderStyle === "bw" ? 0.18 : 0.24));
      body.addColorStop(0.72, state.renderStyle === "bw" ? "rgba(80, 80, 80, 0.4)" : "rgba(72, 118, 111, 0.34)");
      body.addColorStop(1, state.renderStyle === "bw" ? "rgba(17, 17, 17, 0.76)" : "rgba(10, 18, 20, 0.72)");

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(speaker.sx, speaker.sy, radius, 0, Math.PI * 2);
      ctx.fillStyle = body;
      ctx.fill();
      ctx.clip();

      const glow = ctx.createRadialGradient(
        speaker.sx,
        speaker.sy,
        0,
        speaker.sx,
        speaker.sy,
        radius * 0.9
      );
      glow.addColorStop(0, rgba(color, 0.28 + speaker.peak * 0.58));
      glow.addColorStop(0.44, rgba(color, 0.16 + speaker.rms * 0.34));
      glow.addColorStop(1, rgba(color, 0));
      ctx.fillStyle = glow;
      ctx.fillRect(speaker.sx - radius, speaker.sy - radius, radius * 2, radius * 2);

      const gleam = ctx.createRadialGradient(
        speaker.sx - radius * 0.34,
        speaker.sy - radius * 0.4,
        0,
        speaker.sx - radius * 0.34,
        speaker.sy - radius * 0.4,
        radius * 0.46
      );
      gleam.addColorStop(0, `rgba(255, 255, 255, ${selected ? 0.56 : 0.34})`);
      gleam.addColorStop(1, "rgba(255, 255, 255, 0)");
      ctx.fillStyle = gleam;
      ctx.fillRect(speaker.sx - radius, speaker.sy - radius, radius * 2, radius * 2);
      ctx.restore();
    }

    function prismBasis(speaker) {
      const normal = normalize3({ x: speaker.x, y: speaker.y, z: speaker.z }, { x: 0, y: 0, z: 1 });
      const pole = { x: 0, y: 1, z: 0 };
      const dot = dot3(normal, pole);
      let tangent = {
        x: pole.x - normal.x * dot,
        y: pole.y - normal.y * dot,
        z: pole.z - normal.z * dot
      };
      let longAxis = normalize3(tangent, { x: 1, y: 0, z: 0 });

      if (Math.abs(dot3(longAxis, normal)) > 0.98) {
        longAxis = normalize3(cross3({ x: 1, y: 0, z: 0 }, normal), { x: 1, y: 0, z: 0 });
      }

      const sideAxis = normalize3(cross3(normal, longAxis), { x: 1, y: 0, z: 0 });
      return {
        longAxis,
        radialAxis: normal,
        sideAxis
      };
    }

    function drawPath(points) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.closePath();
    }

    function prismGeometry(speaker, width, height) {
      const { longAxis, radialAxis, sideAxis } = prismBasis(speaker);
      const radius = sphereScreenRadius(width, height);
      const short = (10 * state.speakerSize) / Math.max(1, radius);
      const long = short * 2;
      const base = scale3(radialAxis, 1);
      const makeVertex = (longSign, sideSign, radialAmount) => add3(
        add3(
          add3(base, scale3(longAxis, longSign * long * 0.5)),
          scale3(sideAxis, sideSign * short * 0.5)
        ),
        scale3(radialAxis, radialAmount)
      );
      const vertices = [
        makeVertex(-1, -1, 0),
        makeVertex(1, -1, 0),
        makeVertex(1, 1, 0),
        makeVertex(-1, 1, 0),
        makeVertex(-1, -1, short),
        makeVertex(1, -1, short),
        makeVertex(1, 1, short),
        makeVertex(-1, 1, short)
      ].map(vertex => {
        const rotated = rotate(vertex);
        return {
          rotated,
          screen: project(rotated, width, height)
        };
      });

      return {
        vertices,
        faces: [
          { indices: [0, 1, 2, 3], shade: 0.58 },
          { indices: [4, 5, 6, 7], shade: 1 },
          { indices: [0, 4, 7, 3], shade: 0.74 },
          { indices: [1, 5, 6, 2], shade: 0.7 },
          { indices: [3, 2, 6, 7], shade: 0.88 },
          { indices: [0, 1, 5, 4], shade: 0.64 }
        ]
      };
    }

    function clipPolygonToFront(points, width, height) {
      if (hiddenLinesVisible()) return points;
      const plane = frontClipPlane;
      const clipped = [];
      for (let index = 0; index < points.length; index++) {
        const current = points[index];
        const previous = points[(index + points.length - 1) % points.length];
        const currentInside = current.rotated.z >= plane;
        const previousInside = previous.rotated.z >= plane;

        if (currentInside !== previousInside) {
          const t = (plane - previous.rotated.z) / (current.rotated.z - previous.rotated.z);
          const rotated = lerp3(previous.rotated, current.rotated, t);
          clipped.push({
            rotated,
            screen: project(rotated, width, height),
            clipped: true
          });
        }

        if (currentInside) clipped.push(current);
      }
      return clipped;
    }

    function faceFade(points, wasClipped) {
      if (hiddenLinesVisible()) {
        return points.reduce((sum, point) => sum + hiddenDepthFade(point.rotated.z), 0) / points.length;
      }
      const plane = frontClipPlane;
      const band = 0.18;
      const maxDepth = Math.max(...points.map(point => point.rotated.z));
      const fade = Math.max(0, Math.min(1, (maxDepth - plane) / band));
      return Math.max(wasClipped ? 0.5 : 0.28, fade);
    }

    function labelColor(selected) {
      if (state.renderStyle === "bw") return "#111111";
      return selected ? palette().selectedLabel : palette().label;
    }

    function labelOffset(speaker, width, height) {
      const fromCenterX = speaker.sx - width * 0.5;
      const fromCenterY = speaker.sy - height * 0.5;
      const length = Math.hypot(fromCenterX, fromCenterY);
      const fallback = { x: 1, y: -1 };
      const direction = length > 0.001
        ? { x: fromCenterX / length, y: fromCenterY / length }
        : fallback;
      const distance = (state.speakerShape === "prism" ? 24 : 17) + state.speakerSize * 4;
      return {
        x: direction.x * distance,
        y: direction.y * distance
      };
    }

    function drawSpeakerPrism(speaker, color, baseAlpha, selected, width, height) {
      const geometry = prismGeometry(speaker, width, height);
      const faces = geometry.faces.map(face => {
        const original = face.indices.map(index => geometry.vertices[index]);
        const clipped = clipPolygonToFront(original, width, height);
        if (clipped.length < 3) return null;
        const wasClipped = clipped.length !== original.length || clipped.some(point => point.clipped);
        const alpha = faceFade(clipped, wasClipped);
        if (alpha <= 0.025) return null;
        return {
          points: clipped,
          shade: face.shade,
          alpha,
          depth: clipped.reduce((sum, point) => sum + point.rotated.z, 0) / clipped.length,
          wasClipped
        };
      }).filter(Boolean).sort((a, b) => a.depth - b.depth);

      if (!faces.length) {
        speaker.visible = false;
        return false;
      }

      speaker.visible = true;

      for (const face of faces) {
        const points = face.points.map(point => point.screen);
        const alpha = baseAlpha * face.alpha;
        drawPath(points);
        const gradient = ctx.createLinearGradient(
          points[0].x,
          points[0].y,
          points[Math.floor(points.length / 2)].x,
          points[Math.floor(points.length / 2)].y
        );
        const colorAlpha = (state.renderStyle === "bw" ? 0.08 : 0.14) + speaker.rms * 0.12;
        gradient.addColorStop(0, state.renderStyle === "bw" ? "rgba(255, 255, 255, 0.82)" : rgba(color, colorAlpha * face.shade));
        gradient.addColorStop(0.58, rgba(color, (0.18 + speaker.peak * 0.24) * face.shade));
        gradient.addColorStop(1, state.renderStyle === "bw" ? "rgba(17, 17, 17, 0.2)" : "rgba(235, 255, 248, 0.1)");
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = Math.max(0.04, alpha);
        ctx.lineWidth = selected ? 1.7 : 1;
        ctx.strokeStyle = selected ? palette().selectedLabel : state.renderStyle === "bw" ? "rgba(17, 17, 17, 0.58)" : rgba(color, 0.36 + speaker.peak * 0.22);
        drawPath(points);
        ctx.stroke();
        ctx.restore();
      }

      const visiblePoints = faces.flatMap(face => face.points.map(point => point.screen));
      speaker.sx = visiblePoints.reduce((sum, point) => sum + point.x, 0) / visiblePoints.length;
      speaker.sy = visiblePoints.reduce((sum, point) => sum + point.y, 0) / visiblePoints.length;
      return true;
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;
      ctx.clearRect(0, 0, width, height);

      const now = performance.now();
      const deltaMs = state.lastFrame ? Math.min(48, now - state.lastFrame) : 16;
      state.lastFrame = now;
      state.time = now;
      if (state.spin && !state.dragging) {
        state.yaw -= deltaMs * 0.000075;
      }

      drawBackground(width, height);

      const sorted = speakers.map(speaker => {
        const m = meter(speaker.channel, state.time);
        speaker.rms = m.rms;
        speaker.peak = m.peak;
        const r = rotate(speaker);
        const p = project(r, width, height);
        speaker.sx = p.x;
        speaker.sy = p.y;
        speaker.depth = p.depth;
        speaker.scale = p.scale * state.speakerSize;
        speaker.visible = false;
        return speaker;
      }).sort((a, b) => a.depth - b.depth);

      drawStructure(width, height);
      drawHiddenLinesBoundary(width, height);
      drawFogVeil(width, height);

      for (const speaker of sorted) {
        const far = speaker.depth < 0;
        const baseAlpha = far ? 0.42 : 0.94;
        const alpha = foggedAlpha(speaker.depth, baseAlpha);
        const selected = state.selected === speaker.channel;
        const color = colorForPeak(speaker.peak);

        if (state.speakerShape === "sphere") {
          if (!isVisibleDepth(speaker.depth)) continue;
          speaker.visible = true;
          drawSpeakerSphere(speaker, color, alpha, selected);
        } else {
          if (!drawSpeakerPrism(speaker, color, alpha, selected, width, height)) continue;
        }

        if (state.showSpeakerNumbers && (selected || !far)) {
          const offset = labelOffset(speaker, width, height);
          ctx.save();
          ctx.font = "11px -apple-system, BlinkMacSystemFont, sans-serif";
          ctx.textBaseline = "middle";
          ctx.fillStyle = labelColor(selected);
          ctx.fillText(speaker.channel.toString().padStart(2, "0"), speaker.sx + offset.x, speaker.sy + offset.y);
          ctx.restore();
        }
      }

      updatePanel();
      requestAnimationFrame(draw);
    }

    function updatePanel() {
      const active = speakers.filter(s => s.peak > 0.12);
      const peak = speakers.reduce((best, s) => s.peak > best.peak ? s : best, speakers[0]);
      activeCount.textContent = `${active.length}/30`;
      peakText.textContent = peak.label.replace("Fey ", "");
      zoomText.textContent = `Zoom ${state.zoom.toFixed(2)}x`;

      if (state.selected) {
        const selected = speakers.find(s => s.channel === state.selected);
        selectionTitle.textContent = selected.label;
        selectionBody.textContent = `Channel ${selected.channel} / RMS ${selected.rms.toFixed(2)} / Peak ${selected.peak.toFixed(2)} / xyz ${selected.x.toFixed(3)}, ${selected.y.toFixed(3)}, ${selected.z.toFixed(3)}`;
      } else {
        selectionTitle.textContent = "No speaker selected";
        selectionBody.textContent = "Click a speaker in the viewport to inspect channel identity, coordinates, and level state.";
      }

      const barFill = palette().bar;
      const rows = speakers.map(s => `
        <div class="speaker-row">
          <span>${s.label}</span>
          <span class="bar"><i style="width:${Math.round(s.peak * 100)}%; background:${barFill}"></i></span>
          <span>${s.peak.toFixed(2)}</span>
        </div>
      `).join("");
      list.innerHTML = rows;
    }

    function cameraLabel(view) {
      return view === "plan" ? "Plan" : view === "elevation" ? "Elevation" : "Isometric";
    }

    function setView(view) {
      const presets = {
        plan: [0, Math.PI * 0.5],
        elevation: [0, 0],
        isometric: [Math.PI * 0.25, Math.PI * 0.22]
      };
      const preset = presets[view];
      state.cameraView = view;
      state.yaw = preset[0];
      state.pitch = preset[1];
      cameraText.textContent = cameraLabel(view);
      viewButtons.forEach(button => {
        const active = button.dataset.view === view;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    function setRenderStyle(renderStyle) {
      state.renderStyle = renderStyle;
      document.body.dataset.renderStyle = renderStyle;
      renderStyleButtons.forEach(button => {
        const active = button.dataset.renderStyle === renderStyle;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    }

    function exportPng() {
      exportButton.disabled = true;
      exportButton.textContent = "PNG...";
      canvas.toBlob(blob => {
        if (blob) {
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = `orbital-view-${state.cameraView}-axonometric.png`;
          link.click();
          URL.revokeObjectURL(url);
        }
        exportButton.disabled = false;
        exportButton.textContent = "Export PNG";
      }, "image/png");
    }

    viewButtons.forEach(button => {
      button.addEventListener("click", () => setView(button.dataset.view));
    });

    renderStyleButtons.forEach(button => {
      button.addEventListener("click", () => setRenderStyle(button.dataset.renderStyle));
    });

    shapeButtons.forEach(button => {
      button.addEventListener("click", () => {
        state.speakerShape = button.dataset.shape;
        shapeButtons.forEach(shapeButton => {
          const active = shapeButton.dataset.shape === state.speakerShape;
          shapeButton.classList.toggle("active", active);
          shapeButton.setAttribute("aria-pressed", String(active));
        });
      });
    });

    document.getElementById("reset").addEventListener("click", () => {
      state.zoom = 1;
      setView(state.cameraView);
    });

    spinButton.addEventListener("click", () => {
      state.spin = !state.spin;
      spinButton.classList.toggle("active", state.spin);
      spinButton.setAttribute("aria-pressed", String(state.spin));
    });

    exportButton.addEventListener("click", exportPng);

    speakerSizeInput.addEventListener("input", event => {
      state.speakerSize = speakerSizeFromSlider(event.target.value);
      event.target.setAttribute("aria-valuetext", `${state.speakerSize.toFixed(2)}x`);
    });

    fogDensityInput.addEventListener("input", event => {
      state.fogDensity = fogDensityFromSlider(event.target.value);
      event.target.setAttribute("aria-valuetext", state.fogDensity.toString());
    });

    speakerNumbersCheckbox.addEventListener("change", event => {
      state.showSpeakerNumbers = event.target.checked;
    });

    hiddenLinesSwitch.addEventListener("change", event => {
      state.showHiddenLines = event.target.checked;
    });

    canvas.addEventListener("pointerdown", event => {
      state.dragging = true;
      state.lastX = event.clientX;
      state.lastY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", event => {
      if (!state.dragging) return;
      const dx = event.clientX - state.lastX;
      const dy = event.clientY - state.lastY;
      state.yaw -= dx * 0.006;
      state.pitch = Math.max(-1.35, Math.min(1.35, state.pitch + dy * 0.006));
      state.lastX = event.clientX;
      state.lastY = event.clientY;
      cameraText.textContent = `${cameraLabel(state.cameraView)} adjusted`;
    });

    canvas.addEventListener("pointerup", event => {
      state.dragging = false;
      canvas.releasePointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointercancel", () => {
      state.dragging = false;
    });

    canvas.addEventListener("wheel", event => {
      event.preventDefault();
      state.zoom = Math.max(0.62, Math.min(1.75, state.zoom * (event.deltaY > 0 ? 0.94 : 1.06)));
    }, { passive: false });

    canvas.addEventListener("click", event => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      let best = null;
      let distance = Infinity;
      for (const speaker of speakers) {
        if (!speaker.visible) continue;
        const d = Math.hypot(speaker.sx - x, speaker.sy - y);
        if (d < distance) {
          distance = d;
          best = speaker;
        }
      }
      state.selected = best && distance < 18 * state.speakerSize ? best.channel : null;
    });

    window.addEventListener("resize", resize);
    speakerSizeInput.setAttribute("aria-valuetext", `${state.speakerSize.toFixed(2)}x`);
    fogDensityInput.setAttribute("aria-valuetext", state.fogDensity.toString());
    setRenderStyle("purple");
    resize();
    draw();
  </script>
</body>
</html>
